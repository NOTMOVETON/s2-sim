s2:
  update_rate: 50
  viz_rate: 30
  visualizer:
    enabled: true
    port: 1937
  transport:
    type: stub
  world:
    geometry:
      # Пол
      - type: box
        pose: {x: 0, y: 0, z: -0.025, yaw: 0, pitch: 0, roll: 0}
        size: {x: 20, y: 20, z: 0.05}
        color: "#333333"
      # Стена слева (Y+)
      - type: box
        pose: {x: 0, y: 5, z: 0.5, yaw: 0, pitch: 0, roll: 0}
        size: {x: 10, y: 0.2, z: 1.0}
        color: "#4444AA"
      # Стена справа (Y-)
      - type: box
        pose: {x: 0, y: -5, z: 0.5, yaw: 0, pitch: 0, roll: 0}
        size: {x: 10, y: 0.2, z: 1.0}
        color: "#4444AA"
      # Стена спереди (X+)
      - type: box
        pose: {x: 5, y: 0, z: 0.5, yaw: 0, pitch: 0, roll: 0}
        size: {x: 0.2, y: 10, z: 1.0}
        color: "#AA4444"
      # Цилиндр посередине
      - type: cylinder
        pose: {x: 3.0, y: 0.0, z: 0.5, yaw: 0, pitch: 0, roll: 0}
        radius: 0.4
        height: 1.0
        color: "#AA8800"

  agents:
    - name: robot_0
      id: 0
      domain_id: 0
      pose: {x: 0.0, y: 0.0, z: 0.35}
      collision:
        bounding:
          type: sphere
          radius: 0.35
      visual:
        type: box
        size: [0.6, 0.4, 0.3]
        color: "#FF6B35"
      plugins:
        - type: diff_drive
          wheel_base: 0.4
          max_linear_vel: 1.5
          max_angular_vel: 2.0
        - type: lidar
          name: front_lidar
          num_rays: 3600
          min_range: 0.1
          max_range: 10.0
          start_angle: -3.14159
          end_angle: 3.14159
          publish_rate_hz: 10.0

    - name: robot_1
      id: 1
      domain_id: 1
      pose: {x: 2.0, y: 0.0, z: 0.35}
      collision:
        bounding:
          type: sphere
          radius: 0.35
      visual:
        type: box
        size: [0.6, 0.4, 0.3]
        color: "#AA4444"
      plugins:
        - type: diff_drive
          wheel_base: 0.4
          max_linear_vel: 1.5
          max_angular_vel: 2.0
        - type: lidar
          name: front_lidar
          num_rays: 3600
          min_range: 0.1
          max_range: 10.0
          start_angle: -3.14159
          end_angle: 3.14159
          publish_rate_hz: 10.0
    
    - name: robot_2
      id: 2
      domain_id: 2
      pose: {x: -2.0, y: 0.0, z: 0.35}
      collision:
        bounding:
          type: sphere
          radius: 0.35
      visual:
        type: box
        size: [0.6, 0.4, 0.3]
        color: "#4444AA"
      plugins:
        - type: diff_drive
          wheel_base: 0.4
          max_linear_vel: 1.5
          max_angular_vel: 2.0
        - type: lidar
          name: front_lidar
          num_rays: 3600
          min_range: 0.1
          max_range: 10.0
          start_angle: -3.14159
          end_angle: 3.14159
          publish_rate_hz: 10.0
