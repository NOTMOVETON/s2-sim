s2:
  update_rate: 100
  viz_rate: 30
  transport_rate: 100

  # Phase 1: Zone Visual & Control Layer — тестовая сцена
  #
  # Что тестируется сейчас (после 01-01 + 01-02):
  #   fog и emi эффекты зарегистрированы, зоны загружаются
  #   (sensor_mods() не вызывается до задачи 31 — визуально без эффекта на сенсоры)
  #
  # Что будет работать после 01-03/01-05:
  #   lifecycle, detection_mode, self_destruct_policy, owned_zones
  #
  # Что будет видно после 01-06:
  #   вкладка "Зоны" в редакторе, glow/arrows/particles/grid VisualHints

  transport:
    type: stub

  visualizer:
    enabled: true
    port: 1937

  world:
    surface: "flat"
    geo_origin:
      lat: 55.7522
      lon: 37.6156
      alt: 156.0
    geometry:
      # Пол
      - type: "box"
        pose: {x: 0, y: 0, z: -0.025}
        size: {x: 60.0, y: 60.0, z: 0.05}
        color: "#1A1A2E"

      # ── Внешние стены (квадрат 24×24) ────────────────────────────────────────
      - type: "box"
        pose: {x: 0.0, y: 12.0, z: 1.0}
        size: {x: 24.0, y: 0.3, z: 2.0}
        color: "#555566"
      - type: "box"
        pose: {x: 0.0, y: -12.0, z: 1.0}
        size: {x: 24.0, y: 0.3, z: 2.0}
        color: "#555566"
      - type: "box"
        pose: {x: 12.0, y: 0.0, z: 1.0}
        size: {x: 0.3, y: 24.0, z: 2.0}
        color: "#555566"
      - type: "box"
        pose: {x: -12.0, y: 0.0, z: 1.0}
        size: {x: 0.3, y: 24.0, z: 2.0}
        color: "#555566"

      # ── Внутренние перегородки (коридор через туманную зону) ─────────────────
      # Горизонтальная стена с проходом слева — ведёт в fog_zone
      - type: "box"
        pose: {x: 4.5, y: 3.5, z: 1.0}
        size: {x: 3.0, y: 0.3, z: 2.0}
        color: "#445566"
      - type: "box"
        pose: {x: 9.5, y: 3.5, z: 1.0}
        size: {x: 3.5, y: 0.3, z: 2.0}
        color: "#445566"

      # Вертикальная перегородка — разделяет fog и emi зоны
      - type: "box"
        pose: {x: 0.0, y: 2.5, z: 1.0}
        size: {x: 0.3, y: 5.0, z: 2.0}
        color: "#445566"

      # ── Колонны (хорошо видны лидаром) ───────────────────────────────────────
      - type: "cylinder"
        pose: {x: 5.0, y: -5.0, z: 1.0}
        radius: 0.4
        size: {x: 0.8, y: 0.8, z: 2.0}
        color: "#778899"
      - type: "cylinder"
        pose: {x: -5.0, y: -5.0, z: 1.0}
        radius: 0.4
        size: {x: 0.8, y: 0.8, z: 2.0}
        color: "#778899"
      - type: "cylinder"
        pose: {x: -5.0, y: 5.0, z: 1.0}
        radius: 0.4
        size: {x: 0.8, y: 0.8, z: 2.0}
        color: "#778899"

      # ── Ящики в разных точках ─────────────────────────────────────────────────
      - type: "box"
        pose: {x: -8.0, y: 7.0, z: 0.5}
        size: {x: 1.5, y: 0.6, z: 1.0}
        color: "#886644"
      - type: "box"
        pose: {x: 2.0, y: -9.0, z: 0.5}
        size: {x: 2.0, y: 0.5, z: 1.0}
        color: "#664422"
      - type: "box"
        pose: {x: -3.0, y: -9.0, z: 0.5}
        size: {x: 0.8, y: 0.8, z: 1.0}
        color: "#664422"

      # ── Препятствия ВНУТРИ туманной зоны (fog: x=3.5–10.5, y=−4–4) ──────────
      # Все в пределах 1–3м — лидар должен их видеть даже при range×0.25
      - type: "cylinder"
        pose: {x: 7.0, y: 2.5, z: 1.0}
        radius: 0.35
        size: {x: 0.7, y: 0.7, z: 2.0}
        color: "#AABB88"
      - type: "cylinder"
        pose: {x: 9.0, y: 0.0, z: 1.0}
        radius: 0.35
        size: {x: 0.7, y: 0.7, z: 2.0}
        color: "#AABB88"
      - type: "cylinder"
        pose: {x: 5.5, y: -2.0, z: 1.0}
        radius: 0.35
        size: {x: 0.7, y: 0.7, z: 2.0}
        color: "#AABB88"
      - type: "box"
        pose: {x: 8.5, y: -2.5, z: 0.5}
        size: {x: 0.8, y: 0.8, z: 1.0}
        color: "#667755"
      - type: "box"
        pose: {x: 5.0, y: 2.0, z: 0.5}
        size: {x: 1.0, y: 0.5, z: 1.0}
        color: "#667755"

  agents:
    # ── robot_sensor: тестирует лидар, fog и emi зоны ────────────────────────
    - name: "robot_sensor"
      id: 0
      domain_id: 0
      pose: {x: 0.0, y: 0.0, z: 0.0, yaw: 0.0}
      capabilities:
        - "wheeled"
        - "surface_contact"
        - "optical_sensor"
      collision:
        bounding:
          type: "sphere"
          radius: 0.4
      visual:
        type: "box"
        size: [0.8, 0.5, 0.3]
        color: "#FF6B35"
      plugins:
        - type: "diff_drive"
          max_linear_vel: 2.5
          max_angular_vel: 2.0
        - type: "gnss"
          noise_std: 0.1
          publish_rate_hz: 10
        - type: "imu"
          publish_rate_hz: 50
        - type: "lidar"
          max_range: 12.0
          num_rays: 3600
          publish_rate_hz: 10
        - type: "trajectory_recorder"
          record_interval_s: 0.1
          max_points: 500
          color: "#FF6B35"

    # ── robot_simple: без сенсоров, для тестирования зон движения ─────────────
    - name: "robot_simple"
      id: 1
      domain_id: 1
      pose: {x: -4.0, y: -4.0, z: 0.0, yaw: 0.785}
      capabilities:
        - "wheeled"
        - "surface_contact"
      collision:
        bounding:
          type: "sphere"
          radius: 0.4
      visual:
        type: "box"
        size: [0.8, 0.5, 0.3]
        color: "#44AAFF"
      plugins:
        - type: "diff_drive"
          max_linear_vel: 2.0
          max_angular_vel: 1.5
        - type: "trajectory_recorder"
          record_interval_s: 0.1
          max_points: 300
          color: "#44AAFF"

  zones:
    # ── Туман (FogEffect) — в правой части карты ──────────────────────────────
    - id: "fog_zone"
      shape:
        type: aabb
        center: {x: 7.0, y: 0.0, z: 0.5}
        half_size: {x: 3.5, y: 4.0, z: 1.0}
      color: "#AADDFF"
      opacity: 0.35
      label: "Туман (FogEffect)"
      effects:
        - type: fog
          required_capabilities: ["optical_sensor"]
          params:
            range_multiplier: 0.25

    # ── ЭМ-помехи — в левой части карты ──────────────────────────────────────
    - id: "emi_zone"
      shape:
        type: sphere
        center: {x: -7.0, y: 0.0, z: 0.0}
        radius: 3.5
      color: "#FFAA22"
      opacity: 0.3
      label: "ЭМ-помехи (EMIEffect)"
      effects:
        - type: emi
          params:
            noise_addend: 1.5

    # ── Будущие зоны (Phase 1: 01-03/01-05) ──────────────────────────────────
    # Lifecycle: нарастает 10с, затем затухает. Раскомментировать после 01-05.
    # - id: "lifecycle_fog"
    #   shape:
    #     type: sphere
    #     center: {x: 6.0, y: 6.0, z: 0.0}
    #     radius: 3.0
    #   color: "#AADDFF"
    #   opacity: 0.3
    #   label: "Туман (lifecycle)"
    #   lifecycle:
    #     initial_strength: 0.0
    #     growth_rate: 0.1
    #     max_strength: 1.0
    #     decay_delay: 15.0
    #     decay_rate: 0.05
    #     remove_threshold: 0.05
    #   effects:
    #     - type: fog
    #       required_capabilities: ["optical_sensor"]
    #       params:
    #         range_multiplier: 0.3

    # DetectionMode: BOUNDING. Раскомментировать после 01-03.
    # - id: "bounding_zone"
    #   shape:
    #     type: sphere
    #     center: {x: -6.0, y: 6.0, z: 0.0}
    #     radius: 2.0
    #   color: "#FFDD44"
    #   opacity: 0.35
    #   label: "Bounding mode"
    #   detection_mode: "bounding"
    #   effects:
    #     - type: boost_zone
    #       required_capabilities: ["surface_contact"]
    #       params:
    #         speed_multiplier: 1.5

    # SelfDestruct. Раскомментировать после 01-03.
    # - id: "burst_zone"
    #   shape:
    #     type: sphere
    #     center: {x: 0.0, y: -10.0, z: 0.0}
    #     radius: 1.5
    #   color: "#FF8844"
    #   opacity: 0.6
    #   label: "Самоуничтожение"
