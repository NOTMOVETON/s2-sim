s2:
  update_rate: 100
  viz_rate: 30
  transport_rate: 100

  transport:
    type: stub

  visualizer:
    enabled: true
    port: 1937

  world:
    surface: "flat"
    geometry:
      - type: "box"
        pose: {x: 0, y: 0, z: -0.025}
        size: {x: 40.0, y: 40.0, z: 0.05}
        color: "#222222"

  agents:
    # robot_0 — surface_contact + has_battery:
    #   реагирует на все зоны, батарея 50% → заряжается на станции.
    #   battery_level и battery_charging доступны в AgentSnapshot.extra (фронтенд).
    - name: "robot_0"
      id: 0
      domain_id: 0
      pose: {x: 0.0, y: 0.0, z: 0.0, yaw: 0.0}
      capabilities:
        - "surface_contact"
        - "has_battery"
        - "wheeled"
      collision:
        bounding:
          type: "sphere"
          radius: 0.4
      visual:
        type: "box"
        size: [0.8, 0.5, 0.3]
        color: "#FF6B35"
      plugins:
        - type: "diff_drive"
          max_linear_vel: 2.0
          max_angular_vel: 1.5
        - type: "gravity"
        # - type: "battery"
        #   initial_level: 0.5          # 50% заряда при старте
        #   nominal_voltage: 24.0       # В
        #   capacity_ah: 10.0           # Ач (последняя полная ёмкость)
        #   design_capacity_ah: 10.0    # Ач (расчётная ёмкость)
        #   technology: lion            # Li-Ion (nimh|lion|lipo|life|nicd|limn)
        #   location: "main"
        #   publish_rate_hz: 1.0        # ROS2 sensor_msgs/BatteryState @ 1 Гц

    # robot_1 — без surface_contact, без батареи, но wheeled:
    #   лёд/буст/конвейер не действуют, ветер и стоп — да.
    #   battery_level = -1.0 (нет BatteryComponent).
    - name: "robot_1"
      id: 1
      domain_id: 1
      pose: {x: 0.0, y: -3.0, z: 0.0, yaw: 0.0}
      capabilities:
        - "wheeled"
      collision:
        bounding:
          type: "sphere"
          radius: 0.4
      visual:
        type: "box"
        size: [0.8, 0.5, 0.3]
        color: "#44AAFF"
      plugins:
        - type: "diff_drive"
          max_linear_vel: 2.0
          max_angular_vel: 1.5
        - type: "gravity"

  zones:
    # Зона льда: замедляет до 20% скорости
    # required_capabilities переопределяет дефолт плагина (surface_contact)
    - id: "ice_patch"
      shape:
        type: aabb
        center: {x: 5.0, y: 0.0, z: 0.5}
        half_size: {x: 3.0, y: 3.0, z: 1.0}
      color: "#4488FF"
      opacity: 0.3
      label: "Лёд (×0.2)"
      effects:
        - type: ice_modifier
          required_capabilities: ["surface_contact"]
          params:
            traction_coefficient: 0.2
            noise_amplitude: 0.0

    # Зона буста: ускоряет до 180%
    - id: "speed_corridor"
      shape:
        type: aabb
        center: {x: -5.0, y: 0.0, z: 0.5}
        half_size: {x: 2.0, y: 4.0, z: 1.0}
      color: "#44FF88"
      opacity: 0.3
      label: "Буст (×1.8)"
      effects:
        - type: boost_zone
          required_capabilities: ["surface_contact"]
          params:
            speed_multiplier: 1.8

    # Запретная зона: блокирует оба робота
    # required_capabilities не указан — эффект действует на всех
    - id: "danger_zone"
      shape:
        type: sphere
        center: {x: 0.0, y: 5.0, z: 0.0}
        radius: 2.0
      color: "#FF2222"
      opacity: 0.4
      label: "Стоп"
      effects:
        - type: motion_lock
          params:
            source_label: "danger"

    # Конвейерная лента: движение по +X
    # Только robot_0 (surface_contact); robot_1 проезжает насквозь
    - id: "conveyor_main"
      shape:
        type: aabb
        center: {x: 3.0, y: 10.0, z: 0.5}
        half_size: {x: 5.0, y: 2.0, z: 1.0}
      color: "#FF8800"
      opacity: 0.35
      label: "Конвейер →"
      effects:
        - type: conveyor
          required_capabilities: ["surface_contact"]
          params:
            direction: {x: 1.0, y: 0.0, z: 0.0}
            speed: 1.0

    # Ветровая зона: сносит всех (+Y), с порывами
    # required_capabilities не указан — ветер действует на оба робота
    - id: "outdoor_wind"
      shape:
        type: aabb
        center: {x: -8.0, y: 0.0, z: 0.5}
        half_size: {x: 3.0, y: 5.0, z: 1.0}
      color: "#AADDFF"
      opacity: 0.2
      label: "Ветер"
      effects:
        - type: wind
          params:
            wind_vector: {x: 0.0, y: 0.5, z: 0.0}
            gust_amplitude: 0.2
            gust_frequency: 0.3

    # Полоса шипов: прокалывает оба передних колеса у wheeled-роботов
    # Эффект необратим — колёса остаются проколотыми после выхода.
    # DiffDrivePlugin снизит max_speed на 0.7² = 0.49 и добавит drift.
    - id: "nail_strip"
      shape:
        type: aabb
        center: {x: 5.0, y: -3.0, z: 0.5}
        half_size: {x: 0.3, y: 2.0, z: 1.0}
      color: "#AA2200"
      opacity: 0.5
      label: "Шипы (прокол fl+fr)"
      effects:
        - type: tire_puncture
          required_capabilities: ["wheeled"]

    # Зарядная станция: заряжает батарею robot_0
    # Скорость 5%/с → полный заряд за ~10 сек (50% → 100%)
    # battery.charging = true пока robot_0 внутри (сбрасывается при выходе)
    - id: "charging_station"
      shape:
        type: cylinder
        center: {x: 0.0, y: -7.0, z: 0.5}
        radius: 1.5
        half_height: 1.0
      color: "#FFDD44"
      opacity: 0.4
      label: "Зарядка"
      effects:
        - type: charging
          required_capabilities: ["has_battery"]
          params:
            charge_rate: 0.05

    # Портал: немедленный телепорт к противоположной стороне карты
    - id: "portal_in"
      shape:
        type: cylinder
        center: {x: 8.0, y: 0.0, z: 0.5}
        radius: 0.8
        half_height: 1.0
      color: "#CC44FF"
      opacity: 0.5
      label: "Портал →"
      effects:
        - type: teleport
          params:
            trigger_mode: immediate
            target_mode: fixed
            target_entity: agent
            destination: {x: -8.0, y: 0.0, z: 0.0, yaw: 3.14}

    # Медленный портал: телепортирует через 3 секунды нахождения внутри
    - id: "slow_portal"
      shape:
        type: sphere
        center: {x: 0.0, y: 8.0, z: 0.0}
        radius: 1.5
      color: "#8844FF"
      opacity: 0.4
      label: "Медл. портал (3с)"
      effects:
        - type: teleport
          params:
            trigger_mode: after_seconds
            after_seconds: 3.0
            target_mode: fixed
            target_entity: agent
            destination: {x: 0.0, y: -8.0, z: 0.0, yaw: 0.0}
